# Hermes-managed tmux usability defaults (2026-06-30)
# Stable choice: keep mouse ON so MacBook trackpad scrolling works in tmux.
# URL selection is solved separately with prefix+u copying the cockpit URL to clipboard.
set -g mouse on
# Mosh does not reliably forward tmux's OSC52 selector to remote Macs. Route
# deliberate copy actions out-of-band to the user's Studio and Mac Pro
# clipboards instead; the helper reads selection bytes from stdin and logs no
# clipboard content.
set -g set-clipboard off
set -g copy-command '/Users/duhokim/.local/bin/tmux-copy-to-personal-clipboards'
# Some clients (e.g. an ARD reattach) come up as xterm-256color without
# advertising mouse, which silently kills wheel-scroll even with `mouse on`.
# Force the capability so a reattach always gets mouse tracking.
set -sa terminal-features ',*:mouse'
set -g history-limit 50000
# Keep board windows no larger than the smallest attached client, so panes do not
# extend off the right/bottom edge when the same session is open on MacBook + Studio.
set -g window-size smallest
# Use vi copy-mode so tmux wheel bindings are predictable in helper TUIs.
setw -g mode-keys vi

# Copy the latest cockpit URL to tmux/terminal clipboard.
# Use: tmux prefix + u  (usually Ctrl-b, then u)
bind-key u run-shell 'export PATH="/opt/homebrew/bin:$PATH"; url=$(cat /Users/duhokim/HermesOps/cockpit/latest-desktop-url.txt 2>/dev/null || printf %s https://duho-macstudio.taila27502.ts.net/c); tmux set-buffer -w -- "$url"; tmux display-message "Copied cockpit URL to clipboard: $url"'

# Copy the latest approval/execution phrase to tmux/terminal clipboard.
# Use: tmux prefix + e  (usually Ctrl-b, then e)
bind-key e run-shell 'export PATH="/opt/homebrew/bin:$PATH"; phrase=$(cat /Users/duhokim/HermesOps/cockpit/latest-execution-phrase.txt 2>/dev/null || true); tmux set-buffer -w -- "$phrase"; tmux display-message "Copied execution phrase to clipboard"'

# Toggle mouse only if you explicitly need raw terminal selection.
# Use: tmux prefix + m  (usually Ctrl-b, then m)
# ON  = trackpad scrollback works.
# OFF = normal terminal drag-selection works, but scrolling will feel broken again.
# run-shell PATH lacks /opt/homebrew/bin, so a bare `tmux` died 127. Prepend it.
# (A native #{?mouse,...} toggle can't work: that format is always truthy here.)
bind-key m run-shell 'export PATH="/opt/homebrew/bin:$PATH"; if [ "$(tmux show-option -gqv mouse)" = "on" ]; then tmux set-option -g mouse off; tmux refresh-client; tmux display-message "tmux mouse OFF — raw drag-selection works"; else tmux set-option -g mouse on; tmux refresh-client -S; tmux display-message "tmux mouse ON — trackpad scroll works"; fi'

# Pane-safe copying: avoid raw mouse drag across side-by-side tmux columns.
# Use: tmux prefix + p  (usually Ctrl-b, then p)
# This copies only the active pane's recent scrollback to the macOS clipboard and
# saves it under /Users/duhokim/HermesOps/tmux-copies/latest-pane-copy.txt.
bind-key p run-shell 'export PATH="/opt/homebrew/bin:$PATH"; dir=/Users/duhokim/HermesOps/tmux-copies; mkdir -p "$dir"; ts=$(date -u +%Y%m%dT%H%M%SZ); out="$dir/tmux-pane-${ts}.txt"; tmux capture-pane -J -p -S -2000 > "$out"; ln -sf "$out" "$dir/latest-pane-copy.txt"; tmux load-buffer -w "$out"; tmux display-message "Copied active pane only: $out"'

# Use: tmux prefix + P  (usually Ctrl-b, then Shift-p)
# Copies only the currently visible active-pane screen.
bind-key P run-shell 'export PATH="/opt/homebrew/bin:$PATH"; dir=/Users/duhokim/HermesOps/tmux-copies; mkdir -p "$dir"; ts=$(date -u +%Y%m%dT%H%M%SZ); out="$dir/tmux-pane-visible-${ts}.txt"; tmux capture-pane -J -p > "$out"; ln -sf "$out" "$dir/latest-pane-copy.txt"; tmux load-buffer -w "$out"; tmux display-message "Copied visible active pane only: $out"'

# Copy a read-only board inventory summary to clipboard and file.
# Use: tmux prefix + B  (usually Ctrl-b, then Shift-b)
# Saves /Users/duhokim/HermesOps/tmux-copies/latest-board-summary.txt.
bind-key B run-shell 'export PATH="/opt/homebrew/bin:$PATH"; cd /Users/duhokim/NebulaMind/NebulaMind && python3 tools/tmux_board_snapshot.py --output /tmp/tmux-board-status.json && python3 tools/tmux_board_summary.py --copy /tmp/tmux-board-status.json >/dev/null && tmux display-message "Copied board summary to clipboard"'

# Make mouse wheel enter tmux scrollback instead of being swallowed by TUIs.
# Do not use copy-mode -e here: -e automatically exits copy mode at the bottom,
# allowing new TUI output to pull a reader back to the live prompt. Reading now
# stays frozen until q/Escape (or y after an intentional keyboard copy).
# Nested tmux (the Trio view attaches hwao/blanc/tori clients in its panes): when the pane
# runs an app that tracks the mouse itself, forward wheel events instead of scrolling here.
bind-key -T root WheelUpPane if-shell -F -t = "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode ; send-keys -X -N 5 scroll-up }
bind-key -T root WheelDownPane if-shell -F -t = "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { display-message -d 1 '' }
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X -N 5 scroll-down
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down

# Vim-like copy-mode bindings that stay inside one tmux pane.
# prefix+[ enters copy-mode; v starts selection; y copies to clipboard.
# Do not let a drag select the pane under the moving pointer. The tmux 3.6
# defaults include `select-pane` in these bindings, which can move focus into
# an adjacent board pane when the pointer crosses a pane border mid-drag.
# Reserve ordinary left-button drag for tmux selection even when a pane TUI
# advertises mouse reporting. The stock root binding forwards the drag to the
# TUI when `mouse_any_flag` is set, so Hermes/Claude panes otherwise copy
# nothing. Clicks remain available; only dragging enters copy mode.
unbind-key -T root MouseDrag1Pane
bind-key -T root MouseDrag1Pane copy-mode -M
unbind-key -T copy-mode MouseDown1Pane
bind-key -T copy-mode MouseDrag1Pane send-keys -X begin-selection
unbind-key -T copy-mode-vi MouseDown1Pane
bind-key -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '/Users/duhokim/.local/bin/tmux-copy-to-personal-clipboards'
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Mouse selection uses the explicit clipboard bridge and returns the pane to
# live keyboard input. Keeping the selection active here produced stale or
# incorrect follow-up copies on the lid-protected Mosh client.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '/Users/duhokim/.local/bin/tmux-copy-to-personal-clipboards'

# Trio board look (2026-09-26, Duho: "keep this setting"). The dark background and the teal
# cursor live in the MacBook iTerm2 dynamic profile "Trio" (trio.json), NOT here: tmux must
# not paint window-style backgrounds (that hid the cursor and brightened the active pane).
# Only the pane borders are darkened so they do not render white on light client profiles.
set -g pane-border-style 'bg=colour233,fg=colour240'
set -g pane-active-border-style 'bg=colour233,fg=colour250'
set -g message-style 'bg=colour238,fg=colour255'
